[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "codestra-sip-provisioning"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "asyncpg==0.30.0",
  "cryptography==49.0.0",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "PyJWT[crypto]==2.13.0",
  "redis==6.4.0",
  "sqlalchemy==2.0.43",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codestra_sip_provisioning"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["codestra_sip_provisioning"]
plugins = ["pydantic.mypy"]
